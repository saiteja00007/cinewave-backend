# ==========================================
# CineWave Backend - Application Properties
# ==========================================

# Server Configuration
server.port=8080

# ---- Aiven Cloud MySQL Database Configuration ----
# Credentials & connection details configured via environment variables.
# When DB_HOST is set to your Aiven MySQL host, Spring Boot connects to Aiven.
# Default fallback connects to local MySQL (localhost:3306).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cinewave}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (Non-destructive update) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ---- HikariCP Enterprise Connection Pool ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=CineWaveHikariPool

# ---- JWT Authentication ----
cinewave.jwt.secret=${JWT_SECRET:cinewave-default-dev-secret-key-change-in-production-minimum-256-bits-long}
cinewave.jwt.expiration-ms=86400000

# ---- Admin Initialization ----
cinewave.admin.email=${ADMIN_EMAIL:admin@cinewave.com}
cinewave.admin.password=${ADMIN_PASSWORD:Admin@123}
cinewave.admin.name=${ADMIN_NAME:Cinema Administrator}

# ---- CORS Configuration ----
cinewave.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ---- Actuator Health Endpoints ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Logging ----
logging.level.com.cinewave=INFO
logging.level.org.springframework.security=WARN
