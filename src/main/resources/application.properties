# ==========================================
# CineWave Backend - Application Properties
# ==========================================

# Server Configuration
server.port=${PORT:8080}

# ---- Cloud & Local MySQL Database Configuration ----
# Supports direct SPRING_DATASOURCE_URL, or modular DB_HOST, DB_PORT, DB_NAME.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cinewave}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (Non-destructive update) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ---- HikariCP Enterprise Connection Pool ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=CineWaveHikariPool

# ---- JWT Authentication ----
cinewave.jwt.secret=${JWT_SECRET:cinewave-default-dev-secret-key-change-in-production-minimum-256-bits-long}
cinewave.jwt.expiration-ms=86400000

# ---- Admin Initialization ----
cinewave.admin.email=${ADMIN_EMAIL:admin@cinewave.com}
cinewave.admin.password=${ADMIN_PASSWORD:Admin@123}
cinewave.admin.name=${ADMIN_NAME:Cinema Administrator}

# ---- TMDB API Configuration ----
# Store real TMDB API key in TMDB_API_KEY environment variable.
cinewave.tmdb.api-key=${TMDB_API_KEY:}
cinewave.tmdb.base-url=https://api.themoviedb.org/3
cinewave.tmdb.image-base-url=https://image.tmdb.org/t/p

# ---- CORS Configuration ----
cinewave.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://*.railway.app}

# ---- Actuator Health Endpoints ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Mail / SMTP Configuration ----
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

# ---- Twilio / SMS Gateway ----
cinewave.sms.api-key=${CINEWAVE_SMS_API_KEY:}
cinewave.sms.from-number=${CINEWAVE_SMS_FROM:}

# ---- Razorpay Payment Gateway ----
cinewave.razorpay.key-id=${RAZORPAY_KEY_ID:}
cinewave.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---- Logging ----
logging.level.com.cinewave=INFO
logging.level.org.springframework.security=WARN
